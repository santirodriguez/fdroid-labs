name: Local Sudokura source-build probe

# Intentionally manual only. No push/PR/schedule/release triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sudokura-local-source-probe
  cancel-in-progress: false

jobs:
  local-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: /tmp/sudokura-gradle-home
      EXPECTED_SOURCE_SHA: 810888803430d0664c6d02e1b49f67b5e590141d
    steps:
      - name: Checkout laboratory without saved credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: lab
          persist-credentials: false

      - name: Checkout exact Sudokura candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: santirodriguez/Sudokura
          ref: 810888803430d0664c6d02e1b49f67b5e590141d
          path: sudokura
          persist-credentials: false

      - name: Verify the immutable candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sudokura rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test -f sudokura/android/dependencies.lock.json
          test -f lab/sudokura/metadata/org.cajapersonal.sudokura.yml
          test -f lab/sudokura/offline-probe.sh
          test -f lab/sudokura/stage-offline-git.sh
          test -f lab/sudokura/verify-probe.py
          test -f lab/sudokura/offline-android-inputs.py
          bash -n lab/sudokura/offline-probe.sh lab/sudokura/stage-offline-git.sh
          python3 -m unittest discover -s lab/sudokura/tests -v
          echo "Fixed candidate source: $EXPECTED_SOURCE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Prepare Android SDK and open-source font
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -s /usr/share/doc/fonts-dejavu-core/copyright
          : "${ANDROID_HOME:?Expected hosted Android SDK}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          (yes || true) | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Verify and stage native inputs from their recorded hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 sudokura/android/scripts/test_prepare_sources.py
          python3 sudokura/android/scripts/prepare_sources.py
          make -C sudokura assets
          mkdir -p "$GRADLE_USER_HOME"

      - name: Warm Gradle dependencies on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          bash sudokura/android/gradlew --no-daemon :app:assembleProductionRelease -PsudokuraFont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf -PsudokuraFontLicense=/usr/share/doc/fonts-dejavu-core/copyright
          # The offline F-Droid attempt must not reuse a prebuilt application.
          rm -rf sudokura/android/app/build sudokura/android/.gradle

      - name: Stage SHA-256 locked SDL and Gradle archives outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/sudokura/offline-android-inputs.py stage sudokura/android "$RUNNER_TEMP/fdroid-verified-inputs" "$EXPECTED_SOURCE_SHA"
          test -x sudokura/android/.cache/gradle/gradle-8.13/bin/gradle
          python3 - <<'PY'
          import json
          from pathlib import Path
          android = Path('sudokura/android')
          entry = json.loads((android / 'dependencies.lock.json').read_text())['Gradle']
          assert entry['version'] == '8.13'
          root = android / '.cache' / 'gradle' / entry['directory']
          assert root.is_dir()
          assert (root / '.sudokura-source-sha256').read_text().strip() == entry['sha256']
          PY

      - name: Prepare disposable open-source test tooling
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -f lab/sudokura/Dockerfile -t sudokura-fdroid-local:probe lab/sudokura

      - name: Stage a local-only F-Droid metadata tree
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fdroid-local"
          mkdir -p "$work/tools" "$work/logs" "$work/home" "$work/config"
          # The category registry exists only inside this local test workspace.
          cat > "$work/config/categories.yml" <<'CATEGORIES'
          Games:
            name: Games
            description: Games and puzzles
          CATEGORIES
          test -s "$work/config/categories.yml"
          cp lab/sudokura/offline-probe.sh "$work/tools/"
          cp lab/sudokura/verify-probe.py "$work/tools/"
          cp lab/sudokura/offline-android-inputs.py "$work/tools/"
          cat > "$work/config.yml" <<'CONFIG'
          sdk_path: /opt/android-sdk
          gradle: /opt/gradle-8.13/bin/gradle
          ndk_paths:
            '28.2.13676358': /opt/android-sdk/ndk/28.2.13676358
          CONFIG
          # A local Git mirror from the pinned source is the only test origin.
          # fdroidserver itself creates its VCS identity and clone without network.
          bash lab/sudokura/stage-offline-git.sh sudokura "$work" \
            lab/sudokura/metadata/org.cajapersonal.sudokura.yml "$EXPECTED_SOURCE_SHA"
          test -s "$work/logs/source-provenance.txt"

      - name: Execute local checks without any network access
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fdroid-local"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -e HOME=/work/fdroid/home -e ANDROID_HOME=/opt/android-sdk \
            -e ANDROID_SDK_ROOT=/opt/android-sdk -e GRADLE_USER_HOME=/work/gradle-home \
            -v "$work:/work/fdroid:rw" \
            -v "$ANDROID_HOME:/opt/android-sdk:ro" \
            -v "$GRADLE_USER_HOME:/work/gradle-home:rw" \
            -v "$RUNNER_TEMP/fdroid-verified-inputs:/work/verified-inputs:ro" \
            -v "$PWD/sudokura/android/.cache/gradle/gradle-8.13:/opt/gradle-8.13:ro" \
            -w /work/fdroid sudokura-fdroid-local:probe bash tools/offline-probe.sh

      - name: Preserve short-lived diagnostic logs only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sudokura-local-source-probe-logs
          path: ${{ runner.temp }}/fdroid-local/logs/
          retention-days: 3
          if-no-files-found: warn
